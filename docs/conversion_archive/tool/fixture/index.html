<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lume component measurement fixture — conversion only</title>

<!--
  CONVERSION-ONLY MEASUREMENT FIXTURE.

  This page exists so the Flutter conversion can read *computed* styles from
  real components under the real cascade, rather than reading a declaration
  out of a stylesheet and assuming it is the one that wins. It loads the
  production stylesheets unmodified and renders the production builders
  unmodified; it adds no CSS of its own beyond the harness scaffolding below,
  which is scoped to `.fx-*` classes no component uses.

  It is not part of the product, is not linked from anywhere, and is deleted
  together with the web prototype at Phase F9.

  The stylesheets are loaded in the same order index.html loads them, because
  the order is the cascade and a different order is a different answer.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../../../assets/css/tokens.css">
<link rel="stylesheet" href="../../../../assets/css/base.css">
<link rel="stylesheet" href="../../../../assets/css/components.css">
<link rel="stylesheet" href="../../../../assets/css/crud.css">
<link rel="stylesheet" href="../../../../assets/css/screens/shared.css">
<link rel="stylesheet" href="../../../../assets/css/screens/home.css">
<link rel="stylesheet" href="../../../../assets/css/screens/tools.css">
<link rel="stylesheet" href="../../../../assets/css/screens/today.css">
<link rel="stylesheet" href="../../../../assets/css/screens/explore.css">
<link rel="stylesheet" href="../../../../assets/css/screens/trains.css">
<link rel="stylesheet" href="../../../../assets/css/screens/profile.css">
<link rel="stylesheet" href="../../../../assets/css/screens/notifications.css">
<link rel="stylesheet" href="../../../../assets/css/responsive.css">
<link rel="stylesheet" href="../../../../assets/css/rtl.css">
<link rel="stylesheet" href="../../../../assets/css/onboarding.css">
<link rel="stylesheet" href="../../../../assets/css/tools/shared.css">
<link rel="stylesheet" href="../../../../assets/css/tools/markets.css">
<link rel="stylesheet" href="../../../../assets/css/account.css">
<link rel="stylesheet" href="../../../../assets/css/auth.css">

<style>
  /* Harness scaffolding only. Every rule is scoped to a `.fx-` class, none of
     which any component uses, so nothing here can reach a specimen. */
  .fx-page { padding: 0; margin: 0; }
  .fx-case { padding: 12px var(--pad); border-bottom: 1px dashed var(--border-2); }
  .fx-name { font: var(--t-metasm); color: var(--text-3); margin-bottom: 6px; }
  /* Components live inside a screen in the real app, and several of them
     inherit from `.screen`. The specimen host carries the same class so the
     inherited half of the cascade is the same one. */
</style>
</head>
<body>

<!-- The icon sprite, copied from index.html at load so `<use href="#i-…">`
     resolves exactly as it does in the app. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" id="fxSprite"></svg>

<div class="stage">
<div class="app" id="app">
  <main class="screens" id="screens">
    <section class="screen is-active screen--tool" id="screen-fixture">
      <div class="fx-page" id="fxRoot"></div>
    </section>
  </main>
</div>
</div>

<script type="module">
import { SPECIMENS } from './specimens.js';

/* The sprite is defined in index.html, and `<use href="#i-…">` resolves only
   against symbols in the same document. Fetch and inline it rather than
   duplicating it here, so the icons measured are the icons shipped. */
const html = await fetch('../../../../index.html').then((r) => r.text());
const sprite = html.slice(html.indexOf('<svg width="0"'), html.indexOf('</svg>', html.indexOf('<svg width="0"')));
document.getElementById('fxSprite').innerHTML =
  sprite.slice(sprite.indexOf('>') + 1);

const root = document.getElementById('fxRoot');
const index = {};

for (const [name, spec] of Object.entries(SPECIMENS)) {
  const host = document.createElement('div');
  host.className = 'fx-case';
  host.dataset.fx = name;
  host.innerHTML = '<p class="fx-name">' + name + '</p>' + spec.html;
  root.appendChild(host);
  index[name] = spec.sel;
}

/* Published for the measurer. `sel` is resolved within the specimen's own
   host, so two specimens of the same component never collide. */
window.__LUME_FIXTURE__ = {
  names: Object.keys(SPECIMENS),
  selectors: index,
};
document.documentElement.setAttribute('data-fixture-ready', '1');
</script>
</body>
</html>
